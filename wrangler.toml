# Cloudflare Workers 설정
#
# 대시보드(Workers → Import a repository)로 배포하면 빌드/배포 명령은 이렇게 둔다:
#   Build command  : npm run build
#   Deploy command : npx wrangler deploy
#
# 로컬에서 서버까지 띄우려면: npm run dev:worker

# 배포된 Worker 이름과 반드시 같아야 한다.
# 다르면 `wrangler deploy` / `wrangler secret put` 이 같은 이름의 Worker 를 새로
# 만들어 버려서, Secret 을 넣어도 실제로 서비스되는 Worker 에는 반영되지 않는다.
name = "zunfood"
main = "worker/index.ts"
compatibility_date = "2025-09-10"
# Neon 드라이버가 일부 Node 내장 모듈을 참조할 수 있어 켜둔다
compatibility_flags = ["nodejs_compat"]

# 빌드된 SPA 를 Worker 와 함께 배포한다.
# /assets/* 처럼 실제 파일이 있는 경로는 Worker 를 거치지 않고 바로 나간다.
[assets]
directory = "./dist"
binding = "ASSETS"
